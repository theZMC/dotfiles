#:schema https://mise.en.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[bootstrap]
macos.dock.autohide = true
macos.dock.show_recents = false
macos.finder.show_all_files = true
macos.finder.show_pathbar = true
macos.finder.preferred_view_style = "column"
macos.keyboard.key_repeat = 2
macos.keyboard.initial_key_repeat = 15

[dotfiles]
"~/.config" = { source = ".config" }
"~/.claude" = { source = ".claude" }
"~/.agents" = { source = ".agents" }
"~/.gnupg" = { source = ".gnupg" }
"~/.ssh" = { source = ".ssh" }
"~/.gitconfig" = { source = ".gitconfig" }
"~/.zshrc" = { source = ".zshrc" }
"~/.local" = { source = ".local" }

[settings]
experimental = true
auto_install = true
lockfile = false
minimum_release_age = "7d"

[settings.dotfiles]
default_mode = "symlink-each"
root = "~/.dotfiles"

[settings.npm]
package_manager = "pnpm"

[shell_alias]
helm3 = "mise x helm@3 -- helm"

