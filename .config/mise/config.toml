#:schema https://mise.en.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[settings]
experimental = true
auto_install = true
lockfile = true
minimum_release_age = "7d"

[settings.npm]
package_manager = "pnpm"

[shell_alias]
helm3 = "mise x helm@3 -- helm"

[tools]
bat = "0.26.1"
bottom = "0.14.6"
bun = "1.3.14"
"cargo:taws" = "1.2.1"
crane = "0.21.7"
crossplane-cli = "2.3.3"
deno = "2.9.3"
dive = "0.13.1"
docker-cli = "29.6.2"
dotnet = "10.0.302"
dotnet-core = "10.0.302"
fd = "10.4.2"
flux2 = "2.9.2"
fzf = "0.74.1"
gh = "2.96.0"
"github:atanunq/viu" = "1.6.1"
"github:charmbracelet/glow" = "2.1.2"
"github:charmbracelet/gum" = "v0.17.0"
"github:k3d-io/k3d" = "v5.9.0"
"github:tmuxpack/tpack" = "v1.2.1"
"github:tombi-toml/tombi" = "v1.2.4"
"github:uutils/coreutils" = "0.9.0"
"github:uutils/findutils" = "0.9.1"
"github:uutils/sed" = "0.1.1"
go = "1.26.5"
"go:github.com/awslabs/eks-node-viewer/cmd/eks-node-viewer" = "0.7.4"
"go:github.com/charmbracelet/crush" = "v0.85.0"
"go:golang.org/x/tools/gopls" = "v0.23.0"
golangci-lint = "2.12.2"
golangci-lint-langserver = "0.0.12"
helm = "4.2.3"
helm-ls = "0.5.4"
istioctl = "1.30.3"
java = "26.0.1"
k9s = "0.51.0"
kubectl = "1.36.2"
lazygit = "0.63.1"
lua-language-server = "3.18.2"
mkcert = "1.4.4"
neovim = "0.12.4"
node = "26.5.0"
npm = "12.0.1"
"npm:@astrojs/language-server" = "2.16.13"
"npm:@playwright/cli" = "latest"
"npm:@playwright/mcp" = "0.0.78"
"npm:@rynfar/meridian" = "1.56.1"
"npm:@slidev/cli" = "52.18.0"
"npm:@sveltejs/mcp" = "0.1.25"
"npm:@upstash/context7-mcp" = "3.2.4"
"npm:@vtsls/language-server" = "0.3.0"
"npm:agent-browser" = "0.33.0"
"npm:bash-language-server" = "5.6.0"
"npm:ctx7" = "0.5.5"
"npm:prettier" = "3.9.6"
"npm:skills" = "1.5.20"
"npm:svelte-language-server" = "0.18.3"
oh-my-posh = "29.33.0"
packer = "1.15.4"
pnpm = "11.17.0"
pre-commit = "4.6.0"
pulumi = "3.253.0"
python = "3.14.6"
ripgrep = "15.2.0"
ruff = "0.15.22"
rust = "1.97.1"
rust-analyzer = "2026-07-06"
shellcheck = "0.11.0"
shfmt = "3.13.1"
sops = "3.13.2"
stylua = "2.5.2"
taplo = "0.10.0"
terraform = "1.15.8"
terraform-ls = "0.38.8"
tmux = "3.7b"
tree-sitter = "0.26.11"
trufflehog = "v3.95.9"
usage = "3.5.5"
uv = "0.11.29"
viddy = "1.3.1"
yamlfmt = "0.21.0"
yazi = "26.5.6"
yq = "4.53.3"
zoxide = "0.10.0"
aws-cli = { version = "2.36.3", symlink_bins = "true" }
"github:docker/buildx" = { version = "v0.35.0", os = [
  "darwin",
], bin = "docker-buildx", postinstall = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sf "$(which docker-buildx)" "$HOME/.docker/cli-plugins/docker-buildx"' }
hyperfine = "latest"
"npm:@anthropic-ai/claude-code" = { version = "2.1.219", allow_builds = [
  "@anthropic-ai/claude-code",
], minimum_release_age = "1d" }
"npm:opencode-ai" = { version = "1.18.4", allow_builds = [
  "opencode-ai",
], minimum_release_age = "1d" }

[tools.docker-compose]
version = "5.3.1"
postinstall = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sf "$(which docker-cli-plugin-docker-compose)" "$HOME/.docker/cli-plugins/docker-compose"'

[tools."github:defenseunicorns/uds-cli"]
version = "v0.34.2"
bin = "uds"

[tools."github:zarf-dev/zarf"]
version = "v0.81.1"
bin = "zarf"
